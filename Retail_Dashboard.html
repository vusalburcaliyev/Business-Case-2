const q = id => document.getElementById(id);
const read = (name, period) => data[name].filter(r => r.period === period);
const num = (v,d=0) => new Intl.NumberFormat('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
const money = (c,d=2) => 'R$ ' + num(c/100,d);
const pct = n => num(n,2) + '%';
const change = (a,b) => b ? (a/b-1)*100 : null;
const movement = n => (n < 0 ? 'fell ' : 'rose ') + pct(Math.abs(n));
const quarter = id => id.slice(5) + ' ' + id.slice(0,4);
const label = s => ({watches_gifts:'Watches & gifts',health_beauty:'Health & beauty',bed_bath_table:'Bed, bath & table',sports_leisure:'Sports & leisure'}[s] || s.replace(/_/g,' ').replace(/^./,x=>x.toUpperCase()));
const escape = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page = 'sales';
function card(title,value,detail){
  return '<div class="card"><div class="label">'+escape(title)+'</div><p class="value">'+escape(value)+'</p><p class="detail">'+escape(detail)+'</p></div>';
}
function chart(title,sub,rows,opts={}){
  const max = Math.max(1,...rows.map(r=>r[1]));
  return '<section class="panel"><h2>'+escape(title)+'</h2><p class="sub">'+escape(sub)+'</p><div class="bars">'+rows.map(([k,v,shown])=>
    '<div class="bar-row'+(opts.late?' late':'')+'"><span class="bar-name">'+escape(k)+'</span><span class="track" aria-hidden="true"><span class="fill" style="width:'+((100*v/max).toFixed(2))+'%"></span></span><strong class="bar-val">'+escape(shown)+'</strong></div>').join('')+'</div>'+(opts.note?'<p class="fine">'+escape(opts.note)+'</p>':'')+'</section>';
}
function render(){
  const p=q('period').value, x=read('01_scorecard',p)[0], buyers=read('05_repeat_buyers',p)[0];
  const cats=read('03_category_rank',p), states=read('04_state_delivery',p);
  const months=data['02_monthly_trend'].filter(r=>r.month.slice(0,4)===p.slice(0,4) && Math.ceil(Number(r.month.slice(5))/3)===Number(p.slice(-1)));
  const niceMonth=m=>new Intl.DateTimeFormat('en-US',{month:'short',timeZone:'UTC'}).format(new Date(m+'-01T00:00:00Z'));
  q('context').textContent=quarter(p)+' · Orders grouped by purchase date · Brazil marketplace';
  q('sales-tab').setAttribute('aria-pressed',String(page==='sales'));
  q('ops-tab').setAttribute('aria-pressed',String(page==='ops'));
  let findings=[];
  if(page==='sales'){
    q('cards').innerHTML=[
      card('Delivered merchandise sales',money(x.sales_cents,0),'Excludes freight; rounded to whole reais'),
      card('Delivered orders with items',num(x.sold_orders),num(x.placed_orders)+' orders placed'),
      card('Average order value',money(x.aov_cents),'Merchandise sales ÷ delivered orders with items'),
      card('Items per order',num(x.items_per_order,2),num(x.items_sold)+' delivered items'),
      card('Repeat buyer rate',pct(buyers.repeat_pct),num(buyers.repeat_buyers)+' of '+num(buyers.buyers)+' buyers ordered twice or more'),
      card('Freight on sold orders',money(x.freight_cents,0),'Reported separately from sales'),
    ].join('');
    q('charts').innerHTML=chart('Monthly merchandise sales','Delivered orders, grouped by purchase month',months.map(m=>[niceMonth(m.month),m.sales_cents,money(m.sales_cents,0)]))+
      chart('Sales across quarters','Q2 2017 is the same-quarter benchmark',data['01_scorecard'].map(r=>[quarter(r.period),r.sales_cents,money(r.sales_cents,0)]));
    if(p==='2018-Q2'){
      const prior=read('01_scorecard','2018-Q1')[0], year=read('01_scorecard','2017-Q2')[0];
      findings.push('I found that sales '+movement(change(x.sales_cents,prior.sales_cents))+' from Q1. Delivered order volume '+movement(change(x.sold_orders,prior.sold_orders))+' and average order value '+movement(change(x.aov_cents,prior.aov_cents))+'.');
      const trim=read('06_order_value_sensitivity','2018-Q2')[0], trimPrior=read('06_order_value_sensitivity','2018-Q1')[0];
      findings.push('When I excluded orders above '+money(trim.threshold_cents,0)+' from both quarters, sales '+movement(change(trim.sales_without_high_value_cents,trimPrior.sales_without_high_value_cents))+'.');
      findings.push('Against Q2 2017, delivered merchandise sales '+movement(change(x.sales_cents,year.sales_cents))+'. The choice of comparison period changes the story.');
    }else{
      const best=[...months].sort((a,b)=>b.sales_cents-a.sales_cents)[0];
      findings.push('I found that '+niceMonth(best.month)+' had the highest merchandise sales this quarter at '+money(best.sales_cents)+'.');
      findings.push('The '+pct(buyers.repeat_pct)+' repeat rate counts only repeat orders inside this quarter. It does not measure long-term retention.');
    }
  }else{
    const late=x.measured_deliveries-x.on_time_deliveries;
    q('cards').innerHTML=[
      card('On-time delivery',pct(x.on_time_pct),num(x.measured_deliveries)+' delivered orders with usable dates'),
      card('Late deliveries',num(late),'Arrived after the promised date'),
      card('Cancellation rate',pct(x.cancellation_pct),num(x.canceled_orders)+' of '+num(x.placed_orders)+' placed orders'),
      card('Unavailable orders',num(x.unavailable_orders),'Separate from cancellations'),
    ].join('');
    q('charts').innerHTML=chart('Top categories by sales','Delivered item value, excluding freight',cats.slice(0,6).map(r=>[label(r.category),r.sales_cents,money(r.sales_cents,0)]))+
      chart('States with the highest late rates','At least 100 measured deliveries; ranked by late rate',states.slice(0,6).map(r=>[r.state,r.late_pct,pct(r.late_pct)+' · '+num(r.late_deliveries)+' late']),{late:true,note:'Rates show relative risk. The counts indicate the size of the problem.'});
    const most=[...states].sort((a,b)=>b.late_deliveries-a.late_deliveries)[0];
    findings.push('I found that '+label(cats[0].category)+' led this quarter, contributing '+pct(cats[0].sales_share_pct)+' of merchandise sales.');
    findings.push('Among states with at least 100 measured deliveries, '+states[0].state+' had the highest late rate ('+pct(states[0].late_pct)+'). '+most.state+' had the most late deliveries ('+num(most.late_deliveries)+'). These are two different ways to prioritize follow-up.');
    if(p==='2018-Q2') findings.push('On-time delivery rose from '+pct(read('01_scorecard','2018-Q1')[0].on_time_pct)+' in Q1 to '+pct(x.on_time_pct)+' in Q2. The data does not explain what caused the change.');
  }
  q('findings').innerHTML='<h2>Findings</h2><ul>'+findings.map(f=>'<li>'+escape(f)+'</li>').join('')+'</ul>';
}
q('period').addEventListener('change',render);
q('sales-tab').addEventListener('click',()=>{page='sales';render();});
q('ops-tab').addEventListener('click',()=>{page='ops';render();});
render();
</script>
